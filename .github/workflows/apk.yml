# Compila el APK de depuración en GitHub y lo deja descargable en la pestaña Actions.
name: APK

on:
  push:
    paths: ["android/**", "server/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # El runner de GitHub ya trae el SDK de Android instalado (ANDROID_HOME).
      - name: Compilar
        id: compilar
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          estado=${PIPESTATUS[0]}
          if [ "$estado" -ne 0 ]; then
            # Resumen de errores como anotación, para poder leerlo sin descargar el log completo.
            resumen=$( (grep -E "^e: |error:|What went wrong|> " build.log | head -60; echo ---; tail -40 build.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compilación fallida::${resumen}"
          fi
          exit $estado
      - if: failure()
        run: echo "::error title=Paso fallido::java=${{ steps.java.outcome }} compilar=${{ steps.compilar.outcome }} ANDROID_HOME=$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: peritaje-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # Publica el APK como versión "ultima" del repositorio (privada), para descargarlo directo desde el móvil.
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk peritaje.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima peritaje.apk --title "Última versión" --prerelease \
            --notes "APK de prueba compilado desde ${GITHUB_SHA::7}. Instalar encima de la versión anterior."

  servidor:
    # 22.04 todavía ofrece Python 3.8, la versión mínima que admite el PC (Xubuntu 20.04).
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt && python -m pytest -q
